name: Phone Inventory Scraper

on:
  schedule:
    - cron: '0 */6 * * *'
  
  # 手動実行時にブラウザで数値を入力できる「フォーム」を作成
  workflow_dispatch:
    inputs:
      geo_limit:
        description: 'ゲオの取得数'
        required: true
        default: '100'
      nicosuma_limit:
        description: 'にこスマの取得数'
        required: true
        default: '100'
      iosis_limit:
        description: 'イオシスの取得数'
        required: true
        default: '100'
      mmoba_limit:
        description: 'エムモバの取得数'
        required: true
        default: '100'
      daiwan_limit:
        description: 'ダイワンテレコムの取得数'
        required: true
        default: '100'

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリのコードを取得
        uses: actions/checkout@v4

      - name: .envファイルの作成
        run: |
          echo "DATABASE_URL=${{ secrets.DATABASE_URL }}" > .env

      - name: Python 3.11 をセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 依存ライブラリのインストール
        run: |
          cd scraper
          pip install -r requirements.txt

      - name: スクレイパーの実行
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # フォームからの入力値を渡す。定期実行(cron)の時は空になるのでゲオは0、他は '100' をフォールバックとして渡す
          GEO_LIMIT: ${{ inputs.geo_limit || '0' }}
          NICOSUMA_LIMIT: ${{ inputs.nicosuma_limit || '100' }}
          IOSIS_LIMIT: ${{ inputs.iosis_limit || '100' }}
          MMOBA_LIMIT: ${{ inputs.mmoba_limit || '100' }}
          DAIWAN_LIMIT: ${{ inputs.daiwan_limit || '100' }}
        run: |
          cd scraper
          python run_all_scrapers.py

      # スクレイピング結果から当日の価格推移を記録（モデル別ページのグラフ用）
      - name: Node.js をセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Node.js の依存ライブラリのインストール
        run: npm ci

      - name: 価格推移の記録
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run snapshot:prices
