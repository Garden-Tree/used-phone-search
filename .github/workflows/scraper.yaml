name: Phone Inventory Scraper
# Cloudflare Pages 版（cloudflare-pages ブランチ・docs/cloudflare-pages.md）: 在庫の取得 → Yahoo!ショッピング・楽天分の取り込み → 価格推移 →
# サイトの書き出し（next build）→ Cloudflare Pages へ配置、までを1本で行う。
# Cloudflare の Secrets（CLOUDFLARE_*）が無いあいだは、書き出しまでで止まる

on:
  schedule:
    - cron: '0 */6 * * *'
  
  # 手動実行時にブラウザで数値を入力できる「フォーム」を作成
  workflow_dispatch:
    inputs:
      nicosuma_limit:
        description: 'にこスマの取得数'
        required: true
        default: '100'
      amazon_mode:
        description: 'Amazon: dry なら先頭3機種だけ取得して応答を表示し、取り込まない（応答の形を確かめるとき）'
        required: false
        default: ''
      iosis_limit:
        description: 'イオシスの取得数（ページ数の上限。商品のないページで止まる。iPhone が 106 ページ）'
        required: true
        default: '200'
      mmoba_limit:
        description: 'エムモバの取得数'
        required: true
        default: '100'
      daiwan_limit:
        description: 'ダイワンテレコムの取得数'
        required: true
        default: '100'
      rakuten_retry:
        description: '楽天の JSON の取り直し回数（自動で付く。手動では 0 のまま）'
        required: false
        default: '0'

# 手動実行と定期実行が重ならないように（楽天の洗い替え・書き出し・rsync --delete が同時に走らない）
concurrency:
  group: scraper-deploy
  cancel-in-progress: false

# 自分自身を有効化し直すステップで actions: write が必要
permissions:
  contents: read
  actions: write

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    # 取得・スクレイパーが固まったときに6時間（既定）居座って、次の定期実行を待たせないように
    timeout-minutes: 60
    env:
      # 楽天の在庫を置く URL（シンレンタルサーバー）と Cloudflare Pages。値は Secrets・Variables（docs/cloudflare-pages.md）
      RAKUTEN_DATA_URL: ${{ secrets.RAKUTEN_DATA_URL }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Yahoo!ショッピング 商品検索API の Client ID。未登録のあいだは Yahoo の取り込みを飛ばす
      YAHOO_APP_ID: ${{ secrets.YAHOO_APP_ID }}
      # Amazon Creators API（整備済み品）の認証情報・アソシエイトのタグ。AMAZON_CREDENTIAL_ID が未登録のあいだは Amazon の取り込みを飛ばす
      AMAZON_CREDENTIAL_ID: ${{ secrets.AMAZON_CREDENTIAL_ID }}
      CF_PAGES_PROJECT: ${{ vars.CF_PAGES_PROJECT || 'used-phone-search' }}
      HAS_CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}

    steps:
      - name: リポジトリのコードを取得
        uses: actions/checkout@v4
        with:
          # GitHub のトークンを .git に残さない（依存パッケージなどから読まれないように）
          persist-credentials: false

      - name: .envファイルの作成
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        # 値を run: に直接埋め込まない（パスワードの記号をシェルに解釈させない）
        run: echo "DATABASE_URL=$DATABASE_URL" > .env

      - name: Python 3.11 をセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 依存ライブラリのインストール
        run: |
          cd scraper
          pip install -r requirements.txt

      # 1店だけの失敗（403・429・タイムアウト・0件）は警告にして続ける。2店以上の同時失敗・Python の例外（Traceback）はここで失敗にする。
      # 1店の失敗が続いたときは、下の「データ更新の監視」が在庫の古さで失敗にする（docs/operations.md「失敗と警告の分け方」）
      - name: スクレイパーの実行
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # フォームからの入力値を渡す。定期実行(cron)の時は空になるので '100' をフォールバックとして渡す
          NICOSUMA_LIMIT: ${{ inputs.nicosuma_limit || '100' }}
          IOSIS_LIMIT: ${{ inputs.iosis_limit || '200' }}
          MMOBA_LIMIT: ${{ inputs.mmoba_limit || '100' }}
          DAIWAN_LIMIT: ${{ inputs.daiwan_limit || '100' }}
        run: |
          cd scraper
          python run_all_scrapers.py

      # スクレイピング結果から当日の価格推移を記録（モデル別ページのグラフ用）
      - name: Node.js をセットアップ
        if: ${{ !cancelled() }}
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Node.js の依存ライブラリのインストール
        if: ${{ !cancelled() }}
        run: npm ci

      # Yahoo!ショッピングの店（lib/yahooShops.ts）の在庫: Actions から商品検索API を直接呼んで取り込む（IP 制限なし。約3〜5分）。
      # 楽天の取り込みと同様、失敗しても前回の在庫のまま書き出しは続ける（ジョブは失敗として通知される。取得に失敗した店のファイルは書かれず、取り込みも飛ばされる）
      - name: Yahoo!ショッピングの在庫を取り込む
        # リンクはバリューコマース（VC_SID/VC_PID が入ったら）、未提携のあいだはもしもアフィリエイト経由（lib/affiliate.ts）
        if: ${{ !cancelled() && env.YAHOO_APP_ID != '' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          failed=0
          npx tsx scripts/fetch-yahoo.ts || failed=1
          npx tsx scripts/ingest-rakuten.ts yahoo-data --family yahoo || failed=1
          exit "$failed"

      # Amazon.co.jp の整備済み品（lib/amazonShops.ts）: Creators API を直接呼んで取り込む（1秒1回・最大約12分）。Yahoo と同じ扱い（失敗しても書き出しは続け、ジョブは失敗として通知）。
      # 取得に失敗した回は amazon-data/amazon.json.gz が書かれず、取り込みが Amazon の在庫を隠す（価格は24時間を超えて出せない）
      - name: Amazon 整備済み品を取り込む
        if: ${{ !cancelled() && env.AMAZON_CREDENTIAL_ID != '' }}
        timeout-minutes: 20
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          AMAZON_CREDENTIAL_SECRET: ${{ secrets.AMAZON_CREDENTIAL_SECRET }}
          AMAZON_PARTNER_TAG: ${{ secrets.AMAZON_PARTNER_TAG }}
          AMAZON_CREDENTIAL_VERSION: ${{ vars.AMAZON_CREDENTIAL_VERSION || '3.3' }}
        run: |
          if [ "${{ inputs.amazon_mode }}" = "dry" ]; then
            npx tsx scripts/fetch-amazon.ts --debug --dry
            exit 0
          fi
          # 前回の取り込みから10時間たっていなければ取らない（終了コード 78。呼び出しの上限に当たらないよう1日2〜3回に間引く。
          # 価格は20時間で隠すので、1回失敗しても次で間に合う）
          failed=0
          code=0
          npx tsx scripts/fetch-amazon.ts --min-age-hours 10 || code=$?
          if [ "$code" = 78 ]; then exit 0; fi
          # 79: アソシエイトが Creators API の利用条件（売上の実績）を満たしていない。失敗にせず、古い価格を隠すだけにする
          if [ "$code" = 79 ]; then echo "::warning::Amazon: アソシエイトが Creators API の利用条件を満たしていないので取得しない（古い価格は隠す）"; npx tsx scripts/ingest-rakuten.ts amazon-data --family amazon --hide-only; exit $?; fi
          [ "$code" = 0 ] || failed=1
          npx tsx scripts/ingest-rakuten.ts amazon-data --family amazon || failed=1
          exit "$failed"

      # 楽天市場店の在庫: サーバーの fetch.php（cron。この20分前）が書き出した JSON を HTTPS で取ってきて取り込む。
      # 失敗しても前回の在庫のまま書き出しは続ける（ジョブは失敗として通知される）
      - name: 楽天市場店の在庫を取り込む
        id: rakuten
        if: ${{ !cancelled() && env.RAKUTEN_DATA_URL != '' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RAKUTEN_RETRY: ${{ inputs.rakuten_retry || '0' }}
        # 1店の取得に失敗しても、取れた店の分は取り込む。
        # Actions の実行環境によってはシンに 10 分以上つながらないことがある（10/7 15時・10/8 9時）。
        # そのときは失敗にせず、最後に別の実行環境でこのワークフローをやり直す（2回まで。3回目の失敗でジョブを失敗＝通知）
        run: |
          fetch_ok=0
          bash scripts/ci-deploy.sh fetch-rakuten || fetch_ok=1
          # 取得できなかった店は「ファイルがない」で exit 1 になる。bash -e でここで止まると下のやり直しに進まない
          # （10/11・10/12・10/16 の失敗はこれ。やり直しが一度も動いていなかった）ので、終了コードを持ち越す
          ingest_ok=0
          npx tsx scripts/ingest-rakuten.ts rakuten-data || ingest_ok=1
          if [ "$fetch_ok" = 1 ] && [ "$RAKUTEN_RETRY" -lt 2 ]; then
            echo "::warning::楽天の JSON を取得できなかった。別の実行環境でやり直す（$((RAKUTEN_RETRY + 1)) 回目）"
            echo "retry=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$fetch_ok" = 1 ]; then exit 1; fi
          exit "$ingest_ok"

      # にこスマ・イオシスの iPad は店の表記のまま入るので、lib/ipadCatalog.ts の正式名にそろえる
      - name: iPad の機種名をそろえる
        if: ${{ !cancelled() }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run normalize:ipad

      # 公式（イオシス・エムモバ）とモール店（楽天・Yahoo!ショッピング）の同じ商品を突き合わせる（公式のカードにモール店の価格を添え、重複を隠す）。
      # 公式・楽天の取り込みと iPad の機種名そろえの後に行う
      - name: 公式とモール店（イオシス楽天・エムコム Yahoo）の同じ商品を突き合わせる
        if: ${{ !cancelled() }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx tsx scripts/link-duplicate-shops.ts

      # 一部のショップの取得に失敗しても、取れた分で価格推移は記録する（ジョブ自体は失敗のまま通知される）
      - name: 価格推移の記録
        if: ${{ !cancelled() }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run snapshot:prices

      # 監視: 取り込みが止まっていないか（問題があっても書き出しは続け、最後にジョブを失敗にして通知する）。
      # 1回きりの取得の失敗は警告（::warning::）だけ。最終更新が13時間超・8時間超が2店以上・「0件」が2回続いた、などで失敗（scripts/check-health.ts）
      - name: データ更新の監視
        id: health
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx tsx scripts/check-health.ts

      # サイトの書き出し（out/）。DB を読むのはここだけ（実行時は読まない）
      - name: サイトを書き出す
        id: build
        if: ${{ !cancelled() }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXT_PUBLIC_SITE_URL: https://used.gadelog.com
          NEXT_PUBLIC_GA_ID: G-YV3ZR0N6B1 # used 専用の GA4（公開される値）
          # ValueCommerce のサイトID・プロモーションID（Yahoo!ショッピングのリンク用。リンクの URL に出る公開の値。未登録なら商品ページへ直接リンク）
          NEXT_PUBLIC_VC_SID: ${{ secrets.VC_SID }}
          NEXT_PUBLIC_VC_PID: ${{ secrets.VC_PID }}
        run: |
          npx next build
          test -f out/index.html && test -f out/data/inventory/index.json

      # Cloudflare Pages へ配置（scripts/ci-deploy.sh。ファイル数・大きさを Pages の上限と照らしてから wrangler で出す）
      - name: Cloudflare Pages へ配置
        id: deploy
        # 一部の店の取得・楽天の取り込みに失敗した回も、取れた分で書き出せていれば配置する（success() だと止まる）
        if: ${{ !cancelled() && steps.build.outcome == 'success' && env.HAS_CLOUDFLARE_TOKEN == 'true' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bash scripts/ci-deploy.sh deploy

      # IndexNow（Bing・Yandex など）にサイトマップの全 URL を知らせる（scripts/indexnow.ts。失敗しても警告だけ）。
      # 1日1回にする: 定期実行（schedule）のうち、この時点の UTC が 0〜5 時の回だけ＝cron '0 */6' の 0:00 UTC（日本時間 9 時）の回。
      # 遅れて起動しても 6 時間の幅があり、次の 6:00 UTC の回とは重ならない。手動実行・楽天のやり直し（workflow_dispatch）では送らない。
      # 0 時の回が飛ばされた日は送らない（翌日に送る。価格は毎日変わるので全件をまとめて送れば足りる）
      - name: IndexNow に更新を知らせる（1日1回）
        id: indexnow
        if: ${{ !cancelled() && steps.deploy.outcome == 'success' && github.event_name == 'schedule' }}
        continue-on-error: true
        run: |
          hour=$(date -u +%H)
          if [ "$hour" -ge 6 ]; then echo "UTC ${hour}時の回なので送らない（0〜5時の回だけ）"; exit 0; fi
          npx tsx scripts/indexnow.ts

      # 切り替え後（main）に Cloudflare の Secrets が消えると、黙って配置しなくなる。そのときはジョブを失敗にして気づく
      - name: 配置先の設定がなければ失敗にする
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' && (env.HAS_CLOUDFLARE_TOKEN != 'true' || env.CLOUDFLARE_ACCOUNT_ID == '' || env.RAKUTEN_DATA_URL == '') }}
        run: |
          echo "CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID / RAKUTEN_DATA_URL の Secrets がない（サイトか楽天の在庫が更新されていない）"
          exit 1

      - name: 監視で問題があればジョブを失敗にする
        if: ${{ !cancelled() && steps.health.outcome == 'failure' }}
        run: |
          echo "データ更新に問題があります（上の「データ更新の監視」を参照）"
          exit 1

      # GitHub は 60 日間リポジトリに動きがないと定期実行を自動で無効化する（2026/08 に実際に停止した）。
      # 実行のたびにワークフローを有効化し直して、無効化までの期限を延ばす
      - name: 定期実行の自動停止を防ぐ
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/scraper.yaml/enable"

      # 上の「楽天市場店の在庫を取り込む」で取得できなかったとき、別の実行環境でもう一度（GITHUB_TOKEN でも
      # workflow_dispatch は新しい実行を作れる。concurrency でこの実行が終わってから始まる）
      - name: 楽天の取得をやり直す
        if: ${{ !cancelled() && steps.rakuten.outputs.retry == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RAKUTEN_RETRY: ${{ inputs.rakuten_retry || '0' }}
        run: gh workflow run scraper.yaml --repo "${{ github.repository }}" --ref "${{ github.ref_name }}" -f rakuten_retry="$((RAKUTEN_RETRY + 1))"
